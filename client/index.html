<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Real-time group chat application using WebSockets">
    <title>Group Chat — Real-Time Messaging</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- ═══════════════════ LOGIN SCREEN ═══════════════════ -->
    <div id="login-screen" class="screen">
        <div class="login-card">
            <div class="login-glow"></div>
            <div class="login-header">
                <div class="login-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
                    </svg>
                </div>
                <h1>Group Chat</h1>
                <p>Connect with your team in real-time</p>
            </div>
            <div class="login-form">
                <div class="input-group">
                    <input
                        type="text"
                        id="username-input"
                        placeholder="Enter your username"
                        maxlength="20"
                        autocomplete="off"
                        spellcheck="false"
                    >
                    <div class="input-border"></div>
                </div>
                <button id="join-btn">
                    <span>Join Chat</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
                <p id="login-error" class="error-text"></p>
            </div>
        </div>
    </div>

    <!-- ═══════════════════ CHAT SCREEN ═══════════════════ -->
    <div id="chat-screen" class="screen hidden">
        <div class="chat-layout">

            <!-- Header -->
            <header class="chat-header" id="chat-header">
                <div class="header-left">
                    <div class="header-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
                        </svg>
                    </div>
                    <div>
                        <h1>Group Chat</h1>
                        <span class="header-subtitle" id="header-subtitle">0 online</span>
                    </div>
                </div>
                <div class="header-right">
                    <div class="connection-status" id="connection-status">
                        <span class="status-dot connected"></span>
                        <span class="status-text">Connected</span>
                    </div>
                </div>
            </header>

            <!-- Main Chat Area -->
            <div class="chat-body">
                <!-- Messages -->
                <main class="messages-panel" id="messages-panel">
                    <div class="messages-scroll" id="messages-scroll">
                        <!-- Messages will be appended here -->
                    </div>
                </main>

                <!-- Sidebar -->
                <aside class="sidebar" id="sidebar">
                    <div class="sidebar-header">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                        <h2>Online Users</h2>
                    </div>
                    <ul class="user-list" id="user-list">
                        <!-- Users will be listed here -->
                    </ul>
                </aside>
            </div>

            <!-- Typing Indicator -->
            <div class="typing-indicator" id="typing-indicator">
                <div class="typing-dots">
                    <span></span><span></span><span></span>
                </div>
                <span class="typing-text" id="typing-text"></span>
            </div>

            <footer class="chat-footer" id="chat-footer">
                <!-- Emoji Picker Popup -->
                <div class="emoji-picker" id="emoji-picker">
                    <div class="emoji-grid" id="emoji-grid">
                        <!-- Smileys -->
                        <span class="emoji" role="button">😀</span><span class="emoji" role="button">😂</span>
                        <span class="emoji" role="button">😍</span><span class="emoji" role="button">🤣</span>
                        <span class="emoji" role="button">😊</span><span class="emoji" role="button">😎</span>
                        <span class="emoji" role="button">🤔</span><span class="emoji" role="button">😢</span>
                        <span class="emoji" role="button">😡</span><span class="emoji" role="button">🥳</span>
                        <span class="emoji" role="button">😴</span><span class="emoji" role="button">🤯</span>
                        <span class="emoji" role="button">😇</span><span class="emoji" role="button">🤗</span>
                        <span class="emoji" role="button">😏</span><span class="emoji" role="button">🥺</span>
                        <!-- Gestures -->
                        <span class="emoji" role="button">👍</span><span class="emoji" role="button">👎</span>
                        <span class="emoji" role="button">👋</span><span class="emoji" role="button">🙌</span>
                        <span class="emoji" role="button">👏</span><span class="emoji" role="button">🤝</span>
                        <span class="emoji" role="button">✌️</span><span class="emoji" role="button">🤞</span>
                        <!-- Hearts & Symbols -->
                        <span class="emoji" role="button">❤️</span><span class="emoji" role="button">🔥</span>
                        <span class="emoji" role="button">⭐</span><span class="emoji" role="button">💯</span>
                        <span class="emoji" role="button">✅</span><span class="emoji" role="button">❌</span>
                        <span class="emoji" role="button">💡</span><span class="emoji" role="button">🎉</span>
                        <span class="emoji" role="button">🚀</span><span class="emoji" role="button">💬</span>
                        <span class="emoji" role="button">📎</span><span class="emoji" role="button">⚡</span>
                    </div>
                </div>
                <div class="message-input-group">
                    <button class="emoji-toggle-btn" id="emoji-toggle-btn" title="Emoji picker">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
                            <line x1="9" y1="9" x2="9.01" y2="9"/>
                            <line x1="15" y1="9" x2="15.01" y2="9"/>
                        </svg>
                    </button>
                    <input
                        type="text"
                        id="message-input"
                        placeholder="Type a message..."
                        autocomplete="off"
                        spellcheck="true"
                    >
                    <button id="send-btn" title="Send message">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </footer>

        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
